# Orion watchdog max timeout is ~25.8s (tclk 166 MHz; the 10min default is rejected), so use the
# maximum: a heavy upgrade (dpkg + update-initramfs) must not starve PID 1 into a reset.
# A watchdog reset is a full reset, so unlike a warm reboot it does not hang U-Boot when the GPU
# power domain is off. Check on the device: /sys/class/watchdog/watchdog0/timeout reads 25.
[Manager]
RuntimeWatchdogSec=25s
RebootWatchdogSec=20s
