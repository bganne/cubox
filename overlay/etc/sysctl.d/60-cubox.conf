# On top of Debian's linux-sysctl-defaults (fq_codel qdisc, loose rp_filter, no source routing).
# TCP: BBR congestion control (paces itself, fine with fq_codel; module from modules-load.d/bbr.conf),
# ECN negotiated both ways, fast open for client and server.
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_ecn = 1
net.ipv4.tcp_fastopen = 3
# Ignore ICMP redirects (single NIC, static routes from DHCP/config)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
-net.ipv6.conf.all.accept_redirects = 0
-net.ipv6.conf.default.accept_redirects = 0
